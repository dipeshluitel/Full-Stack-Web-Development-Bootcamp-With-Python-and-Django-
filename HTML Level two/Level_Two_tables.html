<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body>
    <table border="1">
      <thead>
        <th>Country Name</th>
        <th>Country Flag</th>
        <th>GDP</th>
      </thead>
      <tr>
        <td>USA</td>
        <td>
          <img
            src="https://cdn.britannica.com/79/4479-050-6EF87027/flag-Stars-and-Stripes-May-1-1795.jpg"
            alt="usaFlag"
            width="200"
            height="100"
          />
        </td>
        <td>29.18 trillion USD</td>
      </tr>
      <tr>
        <td>INDIA</td>
        <td>
          <img
            src="https://upload.wikimedia.org/wikipedia/en/thumb/4/41/Flag_of_India.svg/1200px-Flag_of_India.svg.png"
            width="200"
            height="100"
            alt="usaFlag"
          />
        </td>
        <td>3.913 trillion USD</td>
      </tr>
      <tr>
        <td>Nepal</td>
        <td>
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9b/Flag_of_Nepal.svg/1680px-Flag_of_Nepal.svg.png"
            width="150"
            height="200"
            alt="usaFlag"
          />
        </td>
        <td>42.91 billion USD</td>
      </tr>
    </table>
  </body>
</html>
